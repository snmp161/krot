# Пакеты .deb и .rpm (SPEC 9.2). Переменные окружения:
#   VERSION — версия без префикса v (1.2.3), GOARCH — amd64 | arm64.
# Бинарь нужной архитектуры перед запуском nfpm копируется в dist/krot
# (nfpm не подставляет переменные в contents.src).
name: krot
arch: ${GOARCH}
platform: linux
version: ${VERSION}
version_schema: semver
section: net
priority: optional
maintainer: Sergey Ovchinnikov <sovchinnikov@gmail.com>
homepage: https://github.com/snmp161/krot
license: Apache-2.0
description: ${DESCRIPTION}
changelog: "./packaging/changelog.yaml"

contents:
  - src: ./dist/krot
    dst: /usr/bin/krot
    file_info:
      mode: 0755
  - src: ./dist/krot.bash
    dst: /usr/share/bash-completion/completions/krot
    file_info:
      mode: 0644
  - src: ./dist/_krot
    dst: /usr/share/zsh/site-functions/_krot
    file_info:
      mode: 0644
  - src: ./dist/man/man1/krot.1.gz
    dst: /usr/share/man/man1/krot.1.gz
    file_info:
      mode: 0644
  - src: ./dist/man/ru/man1/krot.1.gz
    dst: /usr/share/man/ru/man1/krot.1.gz
    file_info:
      mode: 0644
  - src: ./dist/man/zh_CN/man1/krot.1.gz
    dst: /usr/share/man/zh_CN/man1/krot.1.gz
    file_info:
      mode: 0644
  - src: ./dist/man/zh_TW/man1/krot.1.gz
    dst: /usr/share/man/zh_TW/man1/krot.1.gz
    file_info:
      mode: 0644
  - src: ./dist/man/es/man1/krot.1.gz
    dst: /usr/share/man/es/man1/krot.1.gz
    file_info:
      mode: 0644
  - src: ./dist/man/pt_BR/man1/krot.1.gz
    dst: /usr/share/man/pt_BR/man1/krot.1.gz
    file_info:
      mode: 0644
  - src: ./dist/man/ko/man1/krot.1.gz
    dst: /usr/share/man/ko/man1/krot.1.gz
    file_info:
      mode: 0644
  - src: ./dist/man/ja/man1/krot.1.gz
    dst: /usr/share/man/ja/man1/krot.1.gz
    file_info:
      mode: 0644
  - src: ./dist/man/ar/man1/krot.1.gz
    dst: /usr/share/man/ar/man1/krot.1.gz
    file_info:
      mode: 0644
  - src: ./dist/man/fr/man1/krot.1.gz
    dst: /usr/share/man/fr/man1/krot.1.gz
    file_info:
      mode: 0644
  - src: ./dist/man/de/man1/krot.1.gz
    dst: /usr/share/man/de/man1/krot.1.gz
    file_info:
      mode: 0644
  - src: ./LICENSE
    dst: /usr/share/doc/krot/LICENSE
    packager: deb
    file_info:
      mode: 0644
  - src: ./LICENSE
    dst: /usr/share/doc/krot/LICENSE
    packager: rpm
    type: license
    file_info:
      mode: 0644
  - src: ./THIRD_PARTY_NOTICES
    dst: /usr/share/doc/krot/THIRD_PARTY_NOTICES
    packager: deb
    file_info:
      mode: 0644
  - src: ./THIRD_PARTY_NOTICES
    dst: /usr/share/doc/krot/THIRD_PARTY_NOTICES
    packager: rpm
    type: license
    file_info:
      mode: 0644
  - src: ./packaging/copyright
    dst: /usr/share/doc/krot/copyright
    packager: deb
    file_info:
      mode: 0644

# Стабильное имя build host нужно для воспроизводимого RPM (SPEC 9.5).
rpm:
  buildhost: reproducible.invalid

# krot не устанавливает WireGuard/AmneziaWG (SPEC 2.2, 11) — только рекомендует.
overrides:
  deb:
    recommends:
      - wireguard-tools
      - iproute2
  rpm:
    recommends:
      - wireguard-tools
      - iproute
