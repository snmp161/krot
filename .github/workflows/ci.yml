name: ci

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: unit tests (race)
        run: go test -race -count=1 -shuffle=on -coverprofile=coverage.out ./...
      - name: coverage
        run: go tool cover -func=coverage.out | tail -n 1
      - name: coverage threshold
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit !(t >= 90.0) }'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage.out

  # Проверка уязвимостей (AGENTS.md: безопасность кода с ключами). govulncheck
  # падает, только если уязвимый код реально вызывается.
  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  # Статический аудит безопасности кода. gosec падает при любых findings;
  # известные false positives размечены в коде // #nosec с обоснованием.
  gosec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          "$(go env GOPATH)/bin/gosec" ./...

  # Статический анализ кода staticcheck; Go выбирается из go.mod, как локально.
  staticcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: module hygiene
        run: |
          go mod tidy -diff
          go mod verify
      - name: shell scripts
        run: make shellcheck
      - name: workflows
        run: make actionlint
      - name: curated changelog
        run: make changelog-check

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: bounded fuzz smoke
        run: make fuzz-smoke

  package:
    name: package preflight (ubuntu:24.04, almalinux:9)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
      - name: build packages and representative smoke
        run: make package-preflight

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          go build -buildvcs=false -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7} -X main.commit=${GITHUB_SHA::7}" -o dist/krot-linux-${{ matrix.goarch }} ./cmd/krot
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: krot-linux-${{ matrix.goarch }}
          path: dist/krot-linux-${{ matrix.goarch }}

  reproducible:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: independent double build
        run: make repro-check

  # SPEC 8.3, 9.1: интеграционные тесты под sudo в отдельных network namespace.
  # AmneziaWG работает на userspace amneziawg-go; теги сверяются с полными SHA,
  # а кэш результата привязан к этим SHA.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AWG_TOOLS_TAG: v3.1.20260812
      AWG_TOOLS_REV: ee0f0a9aa34ff0a0da4b3433b9512781cfe02843
      AWG_GO_TAG: v3.1.20260828
      AWG_GO_REV: b5928efb6ca19f0153958460c3d141f04abc5c2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wireguard-tools iproute2 iputils-ping kmod iptables util-linux
      - name: cache AmneziaWG build
        id: awg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: awg-out
          key: awg-${{ runner.os }}-${{ env.AWG_TOOLS_REV }}-${{ env.AWG_GO_REV }}
      - name: build AmneziaWG from verified revisions
        if: steps.awg-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch "$AWG_TOOLS_TAG" https://github.com/amnezia-vpn/amneziawg-tools awg-tools
          (cd awg-tools && test "$(git rev-parse HEAD)" = "$AWG_TOOLS_REV")
          make -s -C awg-tools/src
          make -s -C awg-tools/src install DESTDIR="$PWD/awg-out" PREFIX=/usr SYSCONFDIR=/etc \
            WITH_WGQUICK=yes WITH_SYSTEMDUNITS=yes WITH_BASHCOMPLETION=no
          git clone -q --depth 1 --branch "$AWG_GO_TAG" https://github.com/amnezia-vpn/amneziawg-go awg-go
          (cd awg-go && test "$(git rev-parse HEAD)" = "$AWG_GO_REV")
          make -s -C awg-go
          install -D -m 0755 awg-go/amneziawg-go awg-out/usr/bin/amneziawg-go
      - name: install AmneziaWG
        run: |
          sudo cp -r awg-out/usr/. /usr/
          sudo install -d -m 0700 /etc/amnezia/amneziawg
          sudo systemctl daemon-reload
          awg --version
          amneziawg-go --version | head -n 1
      - name: build
        run: |
          CGO_ENABLED=0 go build -o krot ./cmd/krot
          CGO_ENABLED=0 go test -c -tags integration -o integration.test ./test/integration
      - name: integration tests
        run: sudo KROT_BIN="$PWD/krot" ./integration.test -test.v -test.count=1 -test.timeout=30m
