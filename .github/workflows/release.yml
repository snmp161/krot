name: release

# SPEC 9.2: на тег v* — всё из ci.yml, статические бинари, пакеты .deb/.rpm,
# smoke-тесты пакетов в матрице ОС (8.4), GitHub Release с SHA256SUMS.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: validate annotated SemVer tag from main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if [[ ! "$TAG" =~ $semver ]]; then
            echo "tag is not strict SemVer with v prefix: $TAG" >&2
            exit 1
          fi
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "release tag must be annotated: $TAG" >&2
            exit 1
          fi
          tagged_commit="$(git rev-parse "$TAG^{commit}")"
          if [ "$tagged_commit" != "$(git rev-parse HEAD)" ]; then
            echo "checkout does not match tagged commit" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$tagged_commit" origin/main; then
            echo "tagged commit is not part of main" >&2
            exit 1
          fi

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: release notes
        run: |
          go install github.com/goreleaser/chglog/cmd/chglog@v0.7.6
          scripts/release-notes.sh "$GITHUB_REF_NAME"
      - name: package metadata
        run: |
          DESCRIPTION="$(cat packaging/description.txt)"
          {
            echo "DESCRIPTION<<EOF"
            printf '%s\n' "$DESCRIPTION"
            echo EOF
          } >> "$GITHUB_ENV"
      - name: binaries
        run: |
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA::7} -X main.date=${date}" \
              -o "dist/krot-linux-$arch" ./cmd/krot
          done
          cp LICENSE THIRD_PARTY_NOTICES dist/
      - name: shell completion
        run: |
          go run ./cmd/krot --completion bash > dist/krot.bash
          go run ./cmd/krot --completion zsh > dist/_krot
          bash -n dist/krot.bash
          scripts/compress-man.sh
      - name: packages
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          for arch in amd64 arm64; do
            cp "dist/krot-linux-$arch" dist/krot
            for format in deb rpm; do
              GOARCH="$arch" VERSION="${GITHUB_REF_NAME#v}" "$(go env GOPATH)/bin/nfpm" package \
                -f packaging/nfpm.yaml -p "$format" -t dist/
            done
          done
          rm dist/krot dist/krot.bash dist/_krot
          rm -rf dist/man
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04", "debian:12", "debian:13", "almalinux:9", "almalinux:10"]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - name: smoke test
        run: scripts/smoke.sh "${{ matrix.image }}" dist "${{ matrix.arch }}"

  release:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - name: prepare release notes
        run: |
          cp dist/release-notes.md "$RUNNER_TEMP/release-notes.md"
          rm dist/release-notes.md
      - name: checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" --draft
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
